<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estadísticas - Uruguay</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="/styles.css">
</head>

<body>

    <nav style="max-width: 800px; margin: 0 auto; padding: 1rem; border-bottom: 1px solid var(--card-border); display: flex; gap: 1.5rem; align-items: center;">
        <a href="/" style="text-decoration: none; color: #4b5563; font-weight: 600;">Noticias</a>
        <a href="/stats" style="text-decoration: none; color: #4f46e5; font-weight: 600;">Estadísticas</a>
        <a href="/indicadores" style="text-decoration: none; color: #4b5563; font-weight: 600;">Indicadores Económicos</a>
    </nav>

    <header style="padding-top: 2rem;">
        <h1>Estadísticas de Mandato</h1>
        <p class="subtitle">Indicadores de la gestión actual</p>
    </header>
    
    <div class="stats-container" id="stats-grid" style="margin-top: 2rem;"></div>

    <script>
        const categoryLabels = {
            "business": "Negocios",
            "crisis": "Crisis",
            "culture": "Cultura",
            "economic": "Económico",
            "entertainment": "Entretenimiento",
            "infrastructure": "Infraestructura",
            "international": "Internacional",
            "law": "Ley / Decreto",
            "politics": "Política",
            "social": "Social"
        };

        async function loadEvents() {
            try {
                const response = await fetch('/api/events');
                const events = await response.json();

                const timeline = document.getElementById('timeline');
                if (!timeline) return;
                timeline.innerHTML = '';

                if (events.length === 0) {
                    timeline.innerHTML = '<div class="loading">Aún no hay eventos registrados en la historia.</div>';
                    return;
                }

                let lastFile = null;

                events.forEach(event => {
                    if (event.sourceFile !== lastFile) {
                        const separator = document.createElement('div');
                        separator.className = 'date-separator';
                        const displayName = event.sourceFile ? event.sourceFile.replace('.json', '') : 'Desconocido';
                        separator.innerHTML = `<span>Archivo: ${displayName}</span>`;
                        timeline.appendChild(separator);
                        lastFile = event.sourceFile;
                    }

                    const card = document.createElement('div');
                    card.className = 'event-card';
                    card.setAttribute('data-category', event.category_id);

                    const label = categoryLabels[event.category_id] || event.category_id;

                    let tagsHtml = '';
                    if (event.tags && event.tags.length > 0) {
                        tagsHtml = `<div class="tags">${event.tags.map(t => `<span class="tag">#${t}</span>`).join('')}</div>`;
                    }

                    let sourcesHtml = '';
                    if (event.sources && event.sources.length > 0) {
                        sourcesHtml = `<div style="font-size: 0.85rem; color: #6b7280; margin-bottom: 1rem;"><strong>Fuentes:</strong> ${event.sources.join(', ')}</div>`;
                    }

                    const rawMarkdown = event.content || '';
                    const isContentEmpty = rawMarkdown.trim().length === 0;
                    const htmlContent = !isContentEmpty ? marked.parse(rawMarkdown) : '';

                    let extraContentHtml = '';
                    if (!isContentEmpty) {
                        extraContentHtml = `
                            <button class="read-more-btn" onclick="toggleContent(this)">Leer desarrollo completo</button>
                            <div class="event-content">${htmlContent}</div>
                        `;
                    }

                    const eventBase64 = btoa(unescape(encodeURIComponent(JSON.stringify(event))));
                    const copySqlBtnHtml = `
                        <button class="copy-sql-btn" onclick="copySql('${eventBase64}', this)" title="Copiar SQL para Supabase">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                            </svg>
                            SQL
                        </button>
                    `;

                    card.innerHTML = `
                        <div class="event-header">
                            <span class="event-category">${label}</span>
                            <span class="event-date">${event.date}</span>
                            ${copySqlBtnHtml}
                        </div>
                        <h3 class="event-title">${event.title}</h3>
                        <p class="event-description">${event.description}</p>
                        ${sourcesHtml}
                        ${tagsHtml}
                        ${extraContentHtml}
                    `;

                    timeline.appendChild(card);
                });
            } catch (error) {
                console.error('Error fetching events:', error);
                document.getElementById('timeline').innerHTML = '<div class="loading" style="color: #ef4444;">Error al conectar con el servidor.</div>';
            }
        }

        function toggleContent(btn) {
            const content = btn.nextElementSibling;
            if (content.style.display === 'block') {
                content.style.display = 'none';
                btn.textContent = 'Leer desarrollo completo';
            } else {
                content.style.display = 'block';
                btn.textContent = 'Ocultar desarrollo';
            }
        }

        function copyTextToClipboard(text) {
            if (!navigator.clipboard) {
                return new Promise((resolve, reject) => {
                    try {
                        const textArea = document.createElement("textarea");
                        textArea.value = text;
                        textArea.style.position = "fixed";
                        textArea.style.top = "0";
                        textArea.style.left = "0";
                        document.body.appendChild(textArea);
                        textArea.focus();
                        textArea.select();
                        const successful = document.execCommand('copy');
                        document.body.removeChild(textArea);
                        if (successful) {
                            resolve();
                        } else {
                            reject(new Error('execCommand copy failed'));
                        }
                    } catch (err) {
                        reject(err);
                    }
                });
            }
            return navigator.clipboard.writeText(text);
        }

        function copySql(eventBase64, btn) {
            try {
                const eventStr = decodeURIComponent(escape(atob(eventBase64)));
                const event = JSON.parse(eventStr);

                const escapeSql = (str) => {
                    if (str === null || str === undefined) return 'NULL';
                    return "'" + String(str).replace(/'/g, "''") + "'";
                };

                const tagsSql = event.tags && event.tags.length > 0
                    ? "ARRAY[" + event.tags.map(t => escapeSql(t)).join(", ") + "]"
                    : "NULL";

                const sourcesSql = event.sources && event.sources.length > 0
                    ? "ARRAY[" + event.sources.map(s => escapeSql(s)).join(", ") + "]"
                    : "NULL";

                const sql = `INSERT INTO public.timeline_events (title, description, date, category_id, content, tags, sources) VALUES (${escapeSql(event.title)}, ${escapeSql(event.description)}, ${escapeSql(event.date)}, ${escapeSql(event.category_id)}, ${escapeSql(event.content || '')}, ${tagsSql}, ${sourcesSql});`;

                copyTextToClipboard(sql).then(() => {
                    const originalText = btn.innerHTML;
                    btn.classList.add('copied');
                    btn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg> Copiado';
                    setTimeout(() => {
                        btn.classList.remove('copied');
                        btn.innerHTML = originalText;
                    }, 2000);
                }).catch(err => console.error('Error copiando al portapapeles:', err));
            } catch (err) {
                console.error('Error parseando evento:', err);
            }
        }

        function copyStatSql(statBase64, btn) {
            try {
                const statStr = decodeURIComponent(escape(atob(statBase64)));
                const stat = JSON.parse(statStr);

                const escapeSql = (str) => {
                    if (str === null || str === undefined) return 'NULL';
                    return "'" + String(str).replace(/'/g, "''") + "'";
                };

                const escapeNum = (num) => {
                    if (num === null || num === undefined) return 'NULL';
                    return num;
                };

                const escapeBool = (bool) => {
                    if (bool === null || bool === undefined) return 'NULL';
                    return bool ? 'true' : 'false';
                };

                const newId = (typeof crypto !== 'undefined' && crypto.randomUUID) ? crypto.randomUUID() : 'id_' + Math.random().toString(36).substr(2, 9);

                const sql = `INSERT INTO public.mandate_stats (id, mandate_id, date, title, description, indicator, value, unit, trend, trend_is_good, source) VALUES (${escapeSql(newId)}, ${escapeSql(stat.mandate_id)}, ${escapeSql(stat.date)}, ${escapeSql(stat.title)}, ${escapeSql(stat.description)}, ${escapeSql(stat.indicator)}, ${escapeNum(stat.value)}, ${escapeSql(stat.unit)}, ${escapeSql(stat.trend)}, ${escapeBool(stat.trend_is_good)}, ${escapeSql(stat.source)});`;

                copyTextToClipboard(sql).then(() => {
                    const originalText = btn.innerHTML;
                    btn.classList.add('copied');
                    btn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg> Copiado';
                    setTimeout(() => {
                        btn.classList.remove('copied');
                        btn.innerHTML = originalText;
                    }, 2000);
                }).catch(err => console.error('Error copiando al portapapeles:', err));
            } catch (err) {
                console.error('Error parseando stat:', err);
            }
        }

        async function loadStats() {
            try {
                const response = await fetch('/api/stats');
                const stats = await response.json();

                const gridContainer = document.getElementById('stats-grid');
                if (!gridContainer || !stats || stats.length === 0) return;

                // Limpiamos el grid original
                gridContainer.innerHTML = '';
                gridContainer.style.display = 'block';

                const groups = {};
                stats.forEach(stat => {
                    const day = stat.sourceFile ? stat.sourceFile.replace('.json', '') : 'Desconocido';
                    if (!groups[day]) groups[day] = [];
                    groups[day].push(stat);
                });

                Object.keys(groups).forEach(day => {
                    const dayDiv = document.createElement('div');
                    dayDiv.style.marginBottom = '2.5rem';

                    const dateHeading = document.createElement('h3');
                    dateHeading.style.margin = '0 0 1rem 0';
                    dateHeading.style.fontSize = '1.1rem';
                    dateHeading.style.color = '#374151';
                    dateHeading.style.borderBottom = '1px solid #f3f4f6';
                    dateHeading.style.paddingBottom = '0.5rem';
                    dateHeading.innerText = `Obtenido el: ${day}`;
                    dayDiv.appendChild(dateHeading);

                    const innerGrid = document.createElement('div');
                    innerGrid.style.display = 'grid';
                    innerGrid.style.gridTemplateColumns = 'repeat(auto-fill, minmax(220px, 1fr))';
                    innerGrid.style.gap = '1rem';

                    groups[day].forEach(stat => {
                        const card = document.createElement('div');
                        card.className = 'stat-card';
                        card.title = stat.description;

                        let trendClass = 'neutral';
                        let trendIcon = '';
                        if (stat.trend === 'up') {
                            trendIcon = '↗';
                            trendClass = stat.trend_is_good ? 'good' : 'bad';
                        } else if (stat.trend === 'down') {
                            trendIcon = '↘';
                            trendClass = stat.trend_is_good ? 'good' : 'bad';
                        } else {
                            trendIcon = '→';
                        }

                        const formattedValue = typeof stat.value === 'number'
                            ? new Intl.NumberFormat('es-UY', { maximumFractionDigits: 2 }).format(stat.value)
                            : stat.value;

                        const statToCopy = { ...stat };
                        delete statToCopy.sourceFile;
                        const statBase64 = btoa(unescape(encodeURIComponent(JSON.stringify(statToCopy))));
                        
                        const copySqlBtnHtml = `
                            <button class="copy-sql-btn" style="margin-left:0; padding:2px 6px; font-size:0.7rem;" onclick="copyStatSql('${statBase64}', this)" title="Copiar SQL para Supabase">
                                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                                </svg>
                                SQL
                            </button>
                        `;

                        card.innerHTML = `
                            <div class="stat-header">
                                <span class="stat-title">${stat.title}</span>
                                <span class="stat-trend ${trendClass}">${trendIcon}</span>
                            </div>
                            <div class="stat-value">${formattedValue} <span class="stat-unit">${stat.unit}</span></div>
                            <div class="stat-footer" style="display: flex; justify-content: space-between; align-items: center;" title="${stat.source}">
                                <span style="overflow: hidden; text-overflow: ellipsis; max-width: 65%;">${stat.source} • ${stat.date}</span>
                                ${copySqlBtnHtml}
                            </div>
                        `;
                        innerGrid.appendChild(card);
                    });

                    dayDiv.appendChild(innerGrid);
                    gridContainer.appendChild(dayDiv);
                });
            } catch (error) {
                console.error('Error fetching stats:', error);
            }
        }

        async function loadEconomy() {
            try {
                const response = await fetch('/api/economy');
                const economies = await response.json();

                const gridContainer = document.getElementById('economy-grid');
                if (!economies || economies.length === 0) return;

                // Limpiamos el grid
                gridContainer.innerHTML = '';
                gridContainer.style.display = 'block'; // Quitamos el grid layout del contenedor principal para apilar

                const labels = {
                    "inflation_annual_pct": { title: "Inflación Anual", unit: "%" },
                    "unemployment_pct": { title: "Desempleo", unit: "%" },
                    "country_risk_points": { title: "Riesgo País (UBI)", unit: "pts" },
                    "gdp_usd_billions": { title: "PBI", unit: "MM USD" },
                    "external_debt_pct_gdp": { title: "Deuda Externa", unit: "% PBI" },
                    "bcu_reserves_usd_millions": { title: "Reservas BCU", unit: "M USD" },
                    "minimum_wage_uyu": { title: "Salario Mínimo", unit: "UYU" },
                    "poverty_rate_pct": { title: "Pobreza", unit: "%" },
                    "fiscal_deficit_pct_gdp": { title: "Déficit Fiscal", unit: "% PBI" }
                };

                // Iteramos sobre todos los registros
                economies.forEach(record => {
                    const recordDiv = document.createElement('div');
                    recordDiv.style.marginBottom = '3rem';
                    recordDiv.style.padding = '1rem';
                    recordDiv.style.background = '#ffffff';
                    recordDiv.style.border = '1px solid #e5e7eb';
                    recordDiv.style.borderRadius = '12px';

                    const headerDiv = document.createElement('div');
                    headerDiv.style.display = 'flex';
                    headerDiv.style.justifyContent = 'space-between';
                    headerDiv.style.alignItems = 'center';
                    headerDiv.style.marginBottom = '1rem';
                    headerDiv.style.borderBottom = '1px solid #f3f4f6';
                    headerDiv.style.paddingBottom = '0.5rem';

                    const dateHeading = document.createElement('h3');
                    dateHeading.style.margin = '0';
                    dateHeading.style.fontSize = '1.1rem';
                    dateHeading.style.color = '#374151';
                    dateHeading.innerText = `Reporte: ${record.date}`;

                    const ecoBase64 = btoa(unescape(encodeURIComponent(JSON.stringify(record))));
                    const copySqlBtnHtml = `
                        <button class="copy-sql-btn" style="padding: 4px 10px;" onclick="copyEconomySql('${ecoBase64}', this)" title="Copiar SQL para Supabase">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 4px;">
                                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                            </svg>
                            Copiar SQL
                        </button>
                    `;

                    headerDiv.innerHTML = dateHeading.outerHTML + copySqlBtnHtml;
                    recordDiv.appendChild(headerDiv);

                    const innerGrid = document.createElement('div');
                    innerGrid.style.display = 'grid';
                    innerGrid.style.gridTemplateColumns = 'repeat(auto-fill, minmax(200px, 1fr))';
                    innerGrid.style.gap = '1rem';

                    for (const [key, conf] of Object.entries(labels)) {
                        const card = document.createElement('div');
                        card.className = 'stat-card';
                        card.style.background = '#f0f9ff';
                        card.style.borderColor = '#bae6fd';

                        const rawVal = record[key];
                        const valHtml = (rawVal === null || rawVal === undefined)
                            ? '<span style="color:#9ca3af; font-size:1.2rem;">Sin datos</span>'
                            : `${new Intl.NumberFormat('es-UY', { maximumFractionDigits: 2 }).format(rawVal)} <span class="stat-unit">${conf.unit}</span>`;

                        card.innerHTML = `
                            <div class="stat-header">
                                <span class="stat-title">${conf.title}</span>
                            </div>
                            <div class="stat-value">${valHtml}</div>
                        `;
                        innerGrid.appendChild(card);
                    }

                    recordDiv.appendChild(innerGrid);
                    gridContainer.appendChild(recordDiv);
                });
            } catch (error) {
                console.error('Error fetching economy:', error);
            }
        }

        function copyEconomySql(ecoBase64, btn) {
            try {
                const statStr = decodeURIComponent(escape(atob(ecoBase64)));
                const data = JSON.parse(statStr);

                const escapeNum = (num) => (num === null || num === undefined) ? 'NULL' : num;

                const sql = `INSERT INTO public.economic_indicators (date, inflation_annual_pct, unemployment_pct, country_risk_points, gdp_usd_billions, external_debt_pct_gdp, bcu_reserves_usd_millions, minimum_wage_uyu, poverty_rate_pct, fiscal_deficit_pct_gdp) VALUES ('${data.date}', ${escapeNum(data.inflation_annual_pct)}, ${escapeNum(data.unemployment_pct)}, ${escapeNum(data.country_risk_points)}, ${escapeNum(data.gdp_usd_billions)}, ${escapeNum(data.external_debt_pct_gdp)}, ${escapeNum(data.bcu_reserves_usd_millions)}, ${escapeNum(data.minimum_wage_uyu)}, ${escapeNum(data.poverty_rate_pct)}, ${escapeNum(data.fiscal_deficit_pct_gdp)}) ON CONFLICT (date) DO UPDATE SET inflation_annual_pct = EXCLUDED.inflation_annual_pct, unemployment_pct = EXCLUDED.unemployment_pct, country_risk_points = EXCLUDED.country_risk_points, gdp_usd_billions = EXCLUDED.gdp_usd_billions, external_debt_pct_gdp = EXCLUDED.external_debt_pct_gdp, bcu_reserves_usd_millions = EXCLUDED.bcu_reserves_usd_millions, minimum_wage_uyu = EXCLUDED.minimum_wage_uyu, poverty_rate_pct = EXCLUDED.poverty_rate_pct, fiscal_deficit_pct_gdp = EXCLUDED.fiscal_deficit_pct_gdp;`;

                copyTextToClipboard(sql).then(() => {
                    const originalText = btn.innerHTML;
                    btn.classList.add('copied');
                    btn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg> Copiado';
                    setTimeout(() => {
                        btn.classList.remove('copied');
                        btn.innerHTML = originalText;
                    }, 2000);
                }).catch(err => console.error('Error copiando al portapapeles:', err));
            } catch (err) {
                console.error('Error parseando economy data:', err);
            }
        }

        // Iniciar
        loadStats();
        loadEconomy();
        loadEvents();
    </script>
</body>

</html>
